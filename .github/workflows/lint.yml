
name: Code Linting

on:
  push:
    branches:
      - main
      - ci-lint-workflow
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: HTML CSS JavaScript Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check repository files
        run: |
          pwd
          ls -la
          test -f package.json

      - name: Install dependencies
        run: npm install

      - name: Run HTML linting
        run: npm run lint:html

      - name: Run CSS linting
        run: npm run lint:css

      - name: Run JavaScript linting
        run: npm run lint:js
