<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#53647a"/></marker></defs>
<rect width="1500" height="1040" fill="#ffffff"/>
<style>
.h{font:700 30px Arial;fill:#172033}.sub{font:16px Arial;fill:#5b6575}.box{fill:#f5f8fc;stroke:#52647d;stroke-width:2}.api{fill:#f8f6ff;stroke:#76639b;stroke-width:2}.db{fill:#f2faf6;stroke:#4d8067;stroke-width:2}.head{font:700 18px Arial;fill:#172033}.tag{font:italic 13px Arial;fill:#64748b}.txt{font:15px Arial;fill:#263449}.line{fill:none;stroke:#53647a;stroke-width:2;marker-end:url(#arr)}.assoc{fill:none;stroke:#53647a;stroke-width:2}.label{font:13px Arial;fill:#46566b;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
</style>
<text x="48" y="52" class="h">COLORS — Class Diagram</text>
<text x="48" y="82" class="sub">Frontend pages, JavaScript client, PHP API endpoints, and conceptual database records</text>
<!-- connectors behind boxes -->
<path class="line" d="M330 235 H430 V365 H485"/><text x="355" y="220" class="label">doLogin()</text>
<path class="line" d="M330 535 H405 V455 H485"/><text x="340" y="558" class="label">add / search / logout</text>
<path class="line" d="M805 330 H875 V190 H955"/><text x="840" y="176" class="label">POST login/password</text>
<path class="line" d="M805 390 H915 V425 H955"/><text x="842" y="412" class="label">POST color/userId</text>
<path class="line" d="M805 450 H875 V660 H955"/><text x="830" y="645" class="label">POST search/userId</text>
<!-- API to database paths -->
<path class="line" d="M1225 190 H1300 V780 H605 V845"/><text x="1310" y="540" class="label">SELECT Users</text>
<path class="line" d="M1225 425 H1300 V800 H975 V845"/><text x="1310" y="620" class="label">INSERT Colors</text>
<path class="line" d="M1225 660 H1300 V820 H975 V845"/><text x="1310" y="745" class="label">SELECT Colors</text>
<!-- frontend -->
<rect class="box" x="55" y="145" width="275" height="180" rx="12"/><text class="head" x="192" y="180" text-anchor="middle">LoginPage</text><text class="tag" x="192" y="202" text-anchor="middle">HTML</text><text class="txt" x="80" y="240">+ loginName: input</text><text class="txt" x="80" y="268">+ loginPassword: input</text><text class="txt" x="80" y="296">+ loginResult: element</text>
<rect class="box" x="55" y="430" width="275" height="210" rx="12"/><text class="head" x="192" y="465" text-anchor="middle">ColorPage</text><text class="tag" x="192" y="487" text-anchor="middle">HTML</text><text class="txt" x="80" y="525">+ searchText: input</text><text class="txt" x="80" y="553">+ colorText: input</text><text class="txt" x="80" y="581">+ colorList: element</text><text class="txt" x="80" y="609">+ add/search result elements</text>
<!-- client -->
<rect class="box" x="485" y="265" width="320" height="300" rx="12"/><text class="head" x="645" y="300" text-anchor="middle">ColorsClient</text><text class="tag" x="645" y="322" text-anchor="middle">JavaScript</text><text class="txt" x="510" y="360">- userId: integer</text><text class="txt" x="510" y="386">- firstName: string</text><text class="txt" x="510" y="412">- lastName: string</text><line x1="510" y1="430" x2="780" y2="430" stroke="#c7d0dc"/><text class="txt" x="510" y="460">+ doLogin() / saveCookie()</text><text class="txt" x="510" y="488">+ readCookie() / doLogout()</text><text class="txt" x="510" y="516">+ addColor() / searchColor()</text>
<!-- APIs -->
<rect class="api" x="955" y="115" width="270" height="150" rx="12"/><text class="head" x="1090" y="150" text-anchor="middle">LoginAPI</text><text class="tag" x="1090" y="172" text-anchor="middle">PHP</text><text class="txt" x="980" y="207">+ getRequestInfo()</text><text class="txt" x="980" y="235">+ returnWithInfo/Error()</text>
<rect class="api" x="955" y="350" width="270" height="150" rx="12"/><text class="head" x="1090" y="385" text-anchor="middle">AddColorAPI</text><text class="tag" x="1090" y="407" text-anchor="middle">PHP</text><text class="txt" x="980" y="442">+ getRequestInfo()</text><text class="txt" x="980" y="470">+ returnWithError()</text>
<rect class="api" x="955" y="585" width="270" height="150" rx="12"/><text class="head" x="1090" y="620" text-anchor="middle">SearchColorsAPI</text><text class="tag" x="1090" y="642" text-anchor="middle">PHP</text><text class="txt" x="980" y="677">+ getRequestInfo()</text><text class="txt" x="980" y="705">+ returnWithInfo/Error()</text>
<!-- data model -->
<rect class="db" x="430" y="845" width="350" height="145" rx="12"/><text class="head" x="605" y="880" text-anchor="middle">User</text><text class="tag" x="605" y="902" text-anchor="middle">conceptual data model</text><text class="txt" x="455" y="936">ID, firstName, lastName, Login, Password</text>
<rect class="db" x="825" y="845" width="300" height="145" rx="12"/><text class="head" x="975" y="880" text-anchor="middle">Color</text><text class="tag" x="975" y="902" text-anchor="middle">conceptual data model</text><text class="txt" x="850" y="936">UserId, Name</text>
<path class="assoc" d="M780 918 H825"/><text class="label" x="800" y="905" text-anchor="middle">1 : 0..*</text>
<text class="sub" x="48" y="1018">Database: COP4331 MySQL • User and Color represent records; they are not implemented PHP classes.</text>
<text class="sub" x="485" y="605">Cookie: firstName, lastName, userId • expires after 20 minutes</text>
</svg>